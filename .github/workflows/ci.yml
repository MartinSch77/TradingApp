# CI for TradingApp: build + tests (with the traceability gate), AddressSanitizer
# evidence, and a non-gating static-analysis report.
#
# Not run here (by design): valgrind/TSan (slow; run locally via
# tools/sanitize.sh), coverage (tools/coverage.sh), Doxygen/StrictDoc docs
# (tools/make_docs.sh), and the Axivion analysis (license-bound, local
# dashboard). See build_all.sh for the full local pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.10.2"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run test suite (JUnit per test function)
        run: QT_QPA_PLATFORM=offscreen ./tools/run_tests.sh build

      - name: Traceability matrix (fails on hard gaps)
        run: python3 tools/trace_report.py

      - name: Upload test results + traceability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            docs/traceability.html

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: ASan + UBSan over the suite
        run: QT_QPA_PLATFORM=offscreen QT_PREFIX="$QT_ROOT_DIR" ./tools/sanitize.sh asan-ubsan

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: analysis-results/sanitize-*

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install analyzers and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-tidy clang-tools clazy
          python3 -m pip install --upgrade cmake ninja lizard
          # PMD CPD is a Java tool (the runner already has a JRE); the fetch
          # script pins the version and unpacks it where tools/cpd_scan.py looks.
          ./tools/fetch_pmd.sh

      # cppcheck loads the whole compile DB, which references the moc autogen
      # outputs — so the tree must be BUILT, not just configured.
      - name: Configure + build (compile database for the analyzers)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j"$(nproc)"

      - name: codespell (typos in comments and docs)
        run: pipx install codespell && codespell src tests docs/*.md tools *.md *.sh requirements .github

      # Report, don't gate: dashboard-triaged findings must not brick CI while
      # they are being worked; the local pipeline (build_all.sh) gates hard.
      - name: cppcheck + clang-tidy + Clang Static Analyzer + clazy + g++ -fanalyzer + lizard + PMD CPD
        continue-on-error: true
        run: ./tools/static_analysis.sh build

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: analysis-results/

  # Exercises the PowerShell entry points, not a hand-written cmake line: the
  # *.ps1 scripts ARE the Windows interface, so they are what CI has to prove.
  # shell: powershell (not pwsh) on purpose — Windows PowerShell 5.1 is what
  # ships with Windows and is the strictest consumer of these scripts (BOM
  # handling, no ternary/??, native-argument quoting).
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install CMake >= 4.2 and Ninja
        run: python -m pip install --upgrade cmake ninja

      # build_all.ps1 imports the Visual Studio developer environment itself
      # (vswhere + vcvars64), so no msvc-dev-cmd action is needed. QT_PREFIX
      # overrides the kit auto-detection with the one this action installed.
      - name: Toolchain status
        shell: powershell
        run: .\setup.ps1 status

      - name: Build + tests + traceability (build_all.ps1)
        shell: powershell
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          QT_QPA_PLATFORM: offscreen
        run: |
          .\build_all.ps1 build test trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # MSVC /analyze needs no extra install and is the Windows counterpart of
      # the g++ -fanalyzer stage. Report, don't gate — same policy as Linux.
      - name: MSVC /analyze + clang-tidy (report only)
        shell: powershell
        continue-on-error: true
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
        run: .\tools\static_analysis.ps1 -BuildDir build

      - name: Upload Windows results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          path: |
            test-results/
            analysis-results/
            docs/traceability.html

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtcharts
          cache: true
      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --break-system-packages --upgrade cmake ninja
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j4
      - name: Tests
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure --timeout 300

  # Android and iOS build from the same CMakeLists (qt-cmake wrappers of the
  # respective kits; see docs/platforms.md) — not built in CI to keep runs
  # lean; enable when release packaging for mobile becomes a deliverable.

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SBOM (syft — SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
      - name: Vulnerability scan (grype over the repo)
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
      - name: Repository scan (trivy — vuln, misconfig, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          scanners: vuln,misconfig,secret
