# CI for TradingApp: build + tests (with the traceability gate), AddressSanitizer
# evidence, and a non-gating static-analysis report.
#
# Not run here (by design): valgrind/TSan (slow; run locally via
# tools/sanitize.sh), coverage (tools/coverage.sh), Doxygen/StrictDoc docs
# (tools/make_docs.sh), and the Axivion analysis (license-bound, local
# dashboard). See build_all.sh for the full local pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt for the aqt-installed CI kits. Windows is pinned separately and LOWER on
  # purpose: aqtinstall (3.3.0, the newest release) cannot fetch the Windows
  # desktop metadata for 6.11.x — `aqt list-qt windows desktop --arch 6.11.1`
  # answers "Failed to download checksum for the file 'Updates.xml'", while
  # linux and mac resolve 6.11.1 fine (verified 2026-07-29). Qt's own online
  # installer does offer 6.11.1 for Windows, so a developer machine can be on
  # it — the build scripts take the newest kit present, and QT_VERSION /
  # QT_PREFIX override both. Raise QT_VERSION_WINDOWS as soon as aqt can see it.
  QT_VERSION: "6.11.1"
  QT_VERSION_WINDOWS: "6.10.3"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq

          # System packages
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl

          # Python tooling
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true

          # Python-based tools used by CI & analysis
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall

          # codespell via pipx (isolated)
          python3 -m pipx install --force codespell || true

          # plantuml jar (used by docs)
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi

          # supply-chain helpers (syft, grype, trivy) - pinned examples
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

          echo "Installed runtime tools: graphviz, java, pipx, strictdoc, doorstop, codespell, sphinx, gcovr, aqtinstall, lizard, plantuml.jar, syft, grype, trivy"

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Provide API key for CI (copy example if missing)
        run: |
          # If a real apiKeyEtoro.json is not provided in CI, fall back to the
          # example file so tests that run in SIMULATION don't fail.
          if [ -f apiKeyEtoro.example.json ] && [ ! -f apiKeyEtoro.json ]; then
            cp apiKeyEtoro.example.json apiKeyEtoro.json
            echo "Copied apiKeyEtoro.example.json -> apiKeyEtoro.json for CI"
          else
            echo "apiKeyEtoro.json present or apiKeyEtoro.example.json missing; skipping copy"
          fi

      - name: Run test suite (JUnit per test function)
        run: QT_QPA_PLATFORM=offscreen ./tools/run_tests.sh build

      - name: Traceability matrix (fails on hard gaps)
        run: python3 tools/trace_report.py

      - name: Upload test results + traceability
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            docs/traceability.html

  # ARM64 Linux — the evidence behind the Raspberry Pi claim in REQ-N-001. A
  # GitHub ARM runner is not a Pi (more cores, more RAM), but it is the same
  # architecture, the same Debian-family userland and the same Qt ARM64 kit, so
  # it proves what a Pi actually needs proven: that the code compiles for
  # aarch64 warning-free and that every test passes there. Anything Pi-specific
  # beyond the architecture (GPU, display server, thermals) is documented in
  # docs/platforms.md instead of pretended here.
  #
  # This job deliberately runs the SCRIPTS rather than hand-written cmake lines:
  # the point is that ./build_all.sh needs no arch-specific arguments, because
  # tools/common.sh resolves the gcc_arm64 kit on its own.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build \
            libgl1-mesa-dev libglx-dev libopengl0 libegl1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          # cmake >= 4.2 (no distro ships it), ninja, and aqt for the Qt kit.
          # The trace stage needs nothing but the standard library.
          python3 -m pip install --break-system-packages --upgrade cmake ninja aqtinstall

      # Not install-qt-action: it resolves the kit for the RUNNER it thinks it is
      # on, and the whole point here is the ARM64 kit in the ~/Qt layout the
      # scripts expect — the same aqt command ./setup.sh runs on a Raspberry Pi.
      - name: Install Qt for Linux ARM64 (with Charts)
        run: |
          set -euo pipefail
          python3 -m aqt install-qt linux_arm64 desktop "$QT_VERSION" linux_gcc_arm64 \
            -m qtcharts -O "$HOME/Qt"
          test -d "$HOME/Qt/$QT_VERSION/gcc_arm64/lib/cmake/Qt6Charts"

      - name: Toolchain status (host detection)
        run: ./setup.sh status

      - name: Provide API key for CI (copy example if missing)
        run: |
          if [ -f apiKeyEtoro.example.json ] && [ ! -f apiKeyEtoro.json ]; then
            cp apiKeyEtoro.example.json apiKeyEtoro.json
          fi

      # No QT_PREFIX, no -DCMAKE_PREFIX_PATH: if the kit resolution regressed,
      # this step is what says so. Warnings are errors in build_all.sh, so an
      # aarch64-only diagnostic — `char` is unsigned there, which is what turns a
      # signedness assumption into a warning — fails the job instead of slipping
      # through as a difference nobody looked for.
      - name: Build + tests + traceability (build_all.sh)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build_all.sh build test trace

      # "Builds and passes its tests" is not the same claim as "runs". The app's
      # own QA hook (TRADINGAPP_SHOT, see src/main.cpp) starts the real
      # QApplication, brings up the window and every dialog, grabs them to PNG
      # and quits — so this step is the aarch64 GUI actually rendering, and the
      # PNGs are the artifact to look at. Without API keys it runs in SIMULATION.
      - name: Start the app on aarch64 and screenshot it
        env:
          QT_QPA_PLATFORM: offscreen
          TRADINGAPP_SHOT: arm64-start.png
          TRADINGAPP_SHOT_OPEN: '1'
          TRADINGAPP_SHOT_DELAY_MS: '8000'
        run: |
          set -euo pipefail
          timeout 120 ./build/TradingApp
          ls -l arm64-start*.png
          test -s arm64-start.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-linux-arm64
          path: |
            test-results/
            docs/traceability.html
            arm64-start*.png

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall
          python3 -m pipx install --force codespell || true
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: ASan + UBSan over the suite
        run: QT_QPA_PLATFORM=offscreen QT_PREFIX="$QT_ROOT_DIR" ./tools/sanitize.sh asan-ubsan

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs
          path: analysis-results/sanitize-*

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall
          python3 -m pipx install --force codespell || true
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install analyzers and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-tidy clang-tools clazy
          python3 -m pip install --upgrade cmake ninja lizard
          # PMD CPD is a Java tool (the runner already has a JRE); the fetch
          # script pins the version and unpacks it where tools/cpd_scan.py looks.
          ./tools/fetch_pmd.sh

      # cppcheck loads the whole compile DB, which references the moc autogen
      # outputs — so the tree must be BUILT, not just configured.
      - name: Configure + build (compile database for the analyzers)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j"$(nproc)"

      - name: codespell (typos in comments and docs)
        run: pipx install codespell && codespell src tests docs/*.md tools *.md *.sh requirements .github

      # Report, don't gate: dashboard-triaged findings must not brick CI while
      # they are being worked; the local pipeline (build_all.sh) gates hard.
      - name: cppcheck + clang-tidy + Clang Static Analyzer + clazy + g++ -fanalyzer + lizard + PMD CPD
        continue-on-error: true
        run: ./tools/static_analysis.sh build

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-results
          path: analysis-results/

  # Exercises the PowerShell entry points, not a hand-written cmake line: the
  # *.ps1 scripts ARE the Windows interface, so they are what CI has to prove.
  # shell: powershell (not pwsh) on purpose — Windows PowerShell 5.1 is what
  # ships with Windows and is the strictest consumer of these scripts (BOM
  # handling, no ternary/??, native-argument quoting).
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Windows)
        shell: powershell
        run: |
          set-StrictMode -Version Latest
          # Install Chocolatey (if not present)
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }

          # System packages
          choco install -y graphviz openjdk --no-progress

          # Python + pipx
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          # `a || b` is a PowerShell 7 operator: Windows PowerShell 5.1 — the shell this
          # job deliberately uses — fails to PARSE it ("The token '||' is not a valid
          # statement separator in this version"), which killed the whole step.
          if ($LASTEXITCODE -ne 0) { Write-Host "pipx ensurepath exited $LASTEXITCODE - continuing" }

          # Python-based tools
          python -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall reportlab

          # pipx-installed tools
          python -m pipx install codespell
          if ($LASTEXITCODE -ne 0) { Write-Host "codespell install skipped ($LASTEXITCODE)" }

          # OpenCppCoverage — the gcov/lcov substitute on Windows (setup.ps1 installs it
          # with winget locally; the runner has choco, which this step already uses).
          # Two bugs here before: the URL
          # releases/latest/download/OpenCppCoverage_x64.zip 404s (the release assets are
          # versioned, OpenCppCoverage-x64-<ver>.zip) and it unpacked into
          # tools\OpenCppCoverage, which tools\coverage.ps1 never probes — it resolves the
          # tool on PATH. Optional by design: coverage.ps1 reports `skipped` without it and
          # this job does not run the coverage stage at all, so a failed install must not
          # fail the job.
          choco install -y opencppcoverage --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "OpenCppCoverage install skipped ($LASTEXITCODE) - the coverage stage reports skipped"
          }
          $ocv = Join-Path $env:ProgramFiles 'OpenCppCoverage'
          if (Test-Path $ocv) { Add-Content -Path $env:GITHUB_PATH -Value $ocv }
          Write-Host "Installed/bootstrapped windows runtime tools"

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install CMake >= 4.2 and Ninja
        run: python -m pip install --upgrade cmake ninja

      # build_all.ps1 imports the Visual Studio developer environment itself
      # (vswhere + vcvars64), so no msvc-dev-cmd action is needed. QT_PREFIX
      # overrides the kit auto-detection with the one this action installed.
      - name: Toolchain status
        shell: powershell
        # Same QT_PREFIX as the build step: without it the report looks for Qt in
        # C:\Qt\<ver>\msvc2022_64 and says MISSING about the kit install-qt-action just
        # put somewhere else.
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
        run: .\setup.ps1 status

      - name: Build + tests + traceability (build_all.ps1)
        shell: powershell
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          QT_QPA_PLATFORM: offscreen
        run: |
          .\build_all.ps1 build test trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # MSVC /analyze needs no extra install and is the Windows counterpart of
      # the g++ -fanalyzer stage. Report, don't gate — same policy as Linux.
      - name: MSVC /analyze + clang-tidy (report only)
        shell: powershell
        continue-on-error: true
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
        run: .\tools\static_analysis.ps1 -BuildDir build

      - name: Upload Windows results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-results
          path: |
            test-results/
            analysis-results/
            docs/traceability.html

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtcharts
          cache: true
      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --break-system-packages --upgrade cmake ninja
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j4
      - name: Tests
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure --timeout 300

  # Android and iOS build from the same CMakeLists (qt-cmake wrappers of the
  # respective kits; see docs/platforms.md) — not built in CI to keep runs
  # lean; enable when release packaging for mobile becomes a deliverable.

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall
          python3 -m pipx install --force codespell || true
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

      - name: SBOM (syft — SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
      - name: Vulnerability scan (grype over the repo)
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
      - name: Repository scan (trivy — vuln, misconfig, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          scanners: vuln,misconfig,secret

  # ---------------------------------------------------------------------------
  # Per-platform build badges
  # ---------------------------------------------------------------------------
  # A GitHub badge reports a WORKFLOW, not a job, so "build passing" for this
  # workflow says nothing about WHICH platform passed — and the Windows-only
  # defects this repo has hit (MSVC C4267, C3493) are exactly what a per-platform
  # badge has to show. Rather than duplicating the builds into separate workflows,
  # this job reads the results of the jobs that already ran and publishes one
  # One colour PDF per push — the same tools/make_report.py the local `report` stage
  # runs, fed with the artifacts the jobs above uploaded. Nothing here re-measures
  # anything: a missing input is reported as "not run" by the script, so the PDF states
  # what THIS run actually did (CI has no coverage stage, so coverage reads "not run").
  #
  # if: always() — a red run is exactly when the report is worth reading, and the
  # downloads are individually tolerant so one absent artifact cannot suppress it.
  report:
    runs-on: ubuntu-24.04
    needs: [build-and-test, static-analysis, sanitize]
    if: always()
    steps:
      - uses: actions/checkout@v7

      # reportlab is the report's only dependency; without it make_report.py exits 3
      # (skipped) and this job would upload nothing.
      - name: Install reportlab
        run: python3 -m pip install --upgrade reportlab

      # test-results/ + docs/traceability.html (the artifact keeps that structure).
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: test-results
          path: .

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: analysis-results
          path: analysis-results

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: sanitizer-logs
          path: analysis-results

      - name: Quality report (PDF)
        run: python3 tools/make_report.py

      - name: Upload the quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: downloads/*.pdf

  # shields.io endpoint badge per platform onto the `badges` branch.
  #
  # if: always() — a FAILING platform must publish "failing"; a badge that only
  # updates on success would freeze at "passing" the moment something breaks.
  badges:
    needs: [build-and-test, build-linux-arm64, build-windows, build-macos]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only the badges branch
    steps:
      - uses: actions/checkout@v7
      - name: Publish build status per platform
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ needs.build-and-test.result }}
          LINUX_ARM64: ${{ needs.build-linux-arm64.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          MACOS: ${{ needs.build-macos.result }}
        run: |
          set -euo pipefail
          publish() { # file, label, job-result
            case "$3" in
            success) msg=passing; colour=brightgreen ;;
            failure) msg=failing; colour=red ;;
            cancelled) msg=cancelled; colour=lightgrey ;;
            skipped) msg=skipped; colour=lightgrey ;;
            *) msg="$3"; colour=yellow ;;
            esac
            ./tools/publish_badge.sh "$1" "$2" "$msg" "$colour"
          }
          publish build-linux.json "build linux" "$LINUX"
          publish build-linux-arm64.json "build linux arm64" "$LINUX_ARM64"
          publish build-windows.json "build windows" "$WINDOWS"
          publish build-macos.json "build macos" "$MACOS"
