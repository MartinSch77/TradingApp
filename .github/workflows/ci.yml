# CI for TradingApp: build + tests (with the traceability gate), AddressSanitizer
# evidence, and a non-gating static-analysis report.
#
# Not run here (by design): valgrind/TSan (slow; run locally via
# tools/sanitize.sh), coverage (tools/coverage.sh), Doxygen/StrictDoc docs
# (tools/make_docs.sh), and the Axivion analysis (license-bound, local
# dashboard). See build_all.sh for the full local pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt for the aqt-installed CI kits. Windows is pinned separately and LOWER on
  # purpose: aqtinstall (3.3.0, the newest release) cannot fetch the Windows
  # desktop metadata for 6.11.x — `aqt list-qt windows desktop --arch 6.11.1`
  # answers "Failed to download checksum for the file 'Updates.xml'", while
  # linux and mac resolve 6.11.1 fine (verified 2026-07-29). Qt's own online
  # installer does offer 6.11.1 for Windows, so a developer machine can be on
  # it — the build scripts take the newest kit present, and QT_VERSION /
  # QT_PREFIX override both. Raise QT_VERSION_WINDOWS as soon as aqt can see it.
  QT_VERSION: "6.11.1"
  QT_VERSION_WINDOWS: "6.10.3"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq

          # System packages
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl

          # Python tooling
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true

          # Python-based tools used by CI & analysis
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall

          # codespell via pipx (isolated)
          python3 -m pipx install --force codespell || true

          # plantuml jar (used by docs)
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi

          # supply-chain helpers (syft, grype, trivy) - pinned examples
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

          echo "Installed runtime tools: graphviz, java, pipx, strictdoc, doorstop, codespell, sphinx, gcovr, aqtinstall, lizard, plantuml.jar, syft, grype, trivy"

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Provide API key for CI (copy example if missing)
        run: |
          # If a real apiKeyEtoro.json is not provided in CI, fall back to the
          # example file so tests that run in SIMULATION don't fail.
          if [ -f apiKeyEtoro.example.json ] && [ ! -f apiKeyEtoro.json ]; then
            cp apiKeyEtoro.example.json apiKeyEtoro.json
            echo "Copied apiKeyEtoro.example.json -> apiKeyEtoro.json for CI"
          else
            echo "apiKeyEtoro.json present or apiKeyEtoro.example.json missing; skipping copy"
          fi

      - name: Run test suite (JUnit per test function)
        run: QT_QPA_PLATFORM=offscreen ./tools/run_tests.sh build

      - name: Traceability matrix (fails on hard gaps)
        run: python3 tools/trace_report.py

      - name: Upload test results + traceability
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/
            docs/traceability.html

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall
          python3 -m pipx install --force codespell || true
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: ASan + UBSan over the suite
        run: QT_QPA_PLATFORM=offscreen QT_PREFIX="$QT_ROOT_DIR" ./tools/sanitize.sh asan-ubsan

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs
          path: analysis-results/sanitize-*

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall
          python3 -m pipx install --force codespell || true
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Install analyzers and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck clang-tidy clang-tools clazy
          python3 -m pip install --upgrade cmake ninja lizard
          # PMD CPD is a Java tool (the runner already has a JRE); the fetch
          # script pins the version and unpacks it where tools/cpd_scan.py looks.
          ./tools/fetch_pmd.sh

      # cppcheck loads the whole compile DB, which references the moc autogen
      # outputs — so the tree must be BUILT, not just configured.
      - name: Configure + build (compile database for the analyzers)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j"$(nproc)"

      - name: codespell (typos in comments and docs)
        run: pipx install codespell && codespell src tests docs/*.md tools *.md *.sh requirements .github

      # Report, don't gate: dashboard-triaged findings must not brick CI while
      # they are being worked; the local pipeline (build_all.sh) gates hard.
      - name: cppcheck + clang-tidy + Clang Static Analyzer + clazy + g++ -fanalyzer + lizard + PMD CPD
        continue-on-error: true
        run: ./tools/static_analysis.sh build

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-results
          path: analysis-results/

  # Exercises the PowerShell entry points, not a hand-written cmake line: the
  # *.ps1 scripts ARE the Windows interface, so they are what CI has to prove.
  # shell: powershell (not pwsh) on purpose — Windows PowerShell 5.1 is what
  # ships with Windows and is the strictest consumer of these scripts (BOM
  # handling, no ternary/??, native-argument quoting).
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Windows)
        shell: powershell
        run: |
          set-StrictMode -Version Latest
          # Install Chocolatey (if not present)
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }

          # System packages
          choco install -y graphviz openjdk --no-progress

          # Python + pipx
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath || Write-Host "pipx ensurepath ok"

          # Python-based tools
          python -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall

          # pipx-installed tools
          python -m pipx install codespell || Write-Host "codespell install skipped"

          # Download OpenCppCoverage (prebuilt binary) to tools\OpenCppCoverage
          $ocvDir = "tools\OpenCppCoverage"
          if (!(Test-Path $ocvDir)) {
            New-Item -ItemType Directory -Path $ocvDir | Out-Null
            $zip = "$ocvDir\OpenCppCoverage.zip"
            Invoke-WebRequest -Uri "https://github.com/OpenCppCoverage/OpenCppCoverage/releases/latest/download/OpenCppCoverage_x64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $ocvDir -Force
            Remove-Item $zip
          }
          Write-Host "Installed/bootstrapped windows runtime tools"

      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install CMake >= 4.2 and Ninja
        run: python -m pip install --upgrade cmake ninja

      # build_all.ps1 imports the Visual Studio developer environment itself
      # (vswhere + vcvars64), so no msvc-dev-cmd action is needed. QT_PREFIX
      # overrides the kit auto-detection with the one this action installed.
      - name: Toolchain status
        shell: powershell
        run: .\setup.ps1 status

      - name: Build + tests + traceability (build_all.ps1)
        shell: powershell
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          QT_QPA_PLATFORM: offscreen
        run: |
          .\build_all.ps1 build test trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # MSVC /analyze needs no extra install and is the Windows counterpart of
      # the g++ -fanalyzer stage. Report, don't gate — same policy as Linux.
      - name: MSVC /analyze + clang-tidy (report only)
        shell: powershell
        continue-on-error: true
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
        run: .\tools\static_analysis.ps1 -BuildDir build

      - name: Upload Windows results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-results
          path: |
            test-results/
            analysis-results/
            docs/traceability.html

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt (with Charts)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtcharts
          cache: true
      - name: Install CMake >= 4.2 and Ninja
        run: python3 -m pip install --break-system-packages --upgrade cmake ninja
      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j4
      - name: Tests
        run: cd build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure --timeout 300

  # Android and iOS build from the same CMakeLists (qt-cmake wrappers of the
  # respective kits; see docs/platforms.md) — not built in CI to keep runs
  # lean; enable when release packaging for mobile becomes a deliverable.

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime tools (Ubuntu)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz default-jre wget unzip curl
          python3 -m pip install --upgrade pip pipx
          python3 -m pipx ensurepath || true
          python3 -m pip install --upgrade strictdoc doorstop sphinx gcovr lizard aqtinstall
          python3 -m pipx install --force codespell || true
          mkdir -p tools
          if [ ! -f tools/plantuml.jar ]; then
            wget -q -O tools/plantuml.jar "https://sourceforge.net/projects/plantuml/files/plantuml.jar/download"
          fi
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v0.88.0 || true
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.61.0 || true
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 0.36.0 || true

      - name: SBOM (syft — SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
      - name: Vulnerability scan (grype over the repo)
        uses: anchore/scan-action@v7
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
      - name: Repository scan (trivy — vuln, misconfig, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          scanners: vuln,misconfig,secret

  # ---------------------------------------------------------------------------
  # Per-platform build badges
  # ---------------------------------------------------------------------------
  # A GitHub badge reports a WORKFLOW, not a job, so "build passing" for this
  # workflow says nothing about WHICH platform passed — and the Windows-only
  # defects this repo has hit (MSVC C4267, C3493) are exactly what a per-platform
  # badge has to show. Rather than duplicating the builds into separate workflows,
  # this job reads the results of the jobs that already ran and publishes one
  # shields.io endpoint badge per platform onto the `badges` branch.
  #
  # if: always() — a FAILING platform must publish "failing"; a badge that only
  # updates on success would freeze at "passing" the moment something breaks.
  badges:
    needs: [build-and-test, build-windows, build-macos]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only the badges branch
    steps:
      - uses: actions/checkout@v7
      - name: Publish build status per platform
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX: ${{ needs.build-and-test.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          MACOS: ${{ needs.build-macos.result }}
        run: |
          set -euo pipefail
          publish() { # file, label, job-result
            case "$3" in
            success) msg=passing; colour=brightgreen ;;
            failure) msg=failing; colour=red ;;
            cancelled) msg=cancelled; colour=lightgrey ;;
            skipped) msg=skipped; colour=lightgrey ;;
            *) msg="$3"; colour=yellow ;;
            esac
            ./tools/publish_badge.sh "$1" "$2" "$msg" "$colour"
          }
          publish build-linux.json "build linux" "$LINUX"
          publish build-windows.json "build windows" "$WINDOWS"
          publish build-macos.json "build macos" "$MACOS"
