# Downloadable builds: a Linux AppImage for x86-64 AND one for ARM64 (Raspberry
# Pi 4/5 on a 64-bit OS), a portable Windows ZIP and an Android APK (arm64-v8a,
# release, signed — sideloadable).
#
# Triggers
#   push of a v* tag   -> builds all four and attaches them to that release
#   workflow_dispatch  -> builds all four and uploads them as run artifacts
#                         only (nothing is published), so the packaging can be
#                         exercised without cutting a release
#
# The jobs run the SAME scripts a developer runs locally
# (tools/package_appimage.sh, tools\package_portable.ps1,
# tools/build_android.sh) — the packaging is not reimplemented in YAML, so what
# CI publishes is what those scripts produce.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to attach assets to the release

env:
  # Qt for the aqt-installed CI kits. Windows is pinned separately and LOWER on
  # purpose: aqtinstall (3.3.0, the newest release) cannot fetch the Windows
  # desktop metadata for 6.11.x — `aqt list-qt windows desktop --arch 6.11.1`
  # answers "Failed to download checksum for the file 'Updates.xml'", while
  # linux and mac resolve 6.11.1 fine (verified 2026-07-29). Qt's own online
  # installer does offer 6.11.1 for Windows, so a developer machine can be on
  # it — the build scripts take the newest kit present, and QT_VERSION /
  # QT_PREFIX override both. Raise QT_VERSION_WINDOWS as soon as aqt can see it.
  QT_VERSION: "6.11.1"
  QT_VERSION_WINDOWS: "6.10.3"

jobs:
  appimage:
    name: Linux AppImage
    # Deliberately NOT ubuntu-latest: an AppImage cannot run on a glibc older
    # than the one it was linked against, so it is built on the oldest runner
    # image still supported (glibc 2.35) to cover the widest range of distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt (with Charts and Graphs)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          # qtgraphs, not just qtcharts: TradingCockpit (the Qt Quick front end,
          # REQ-F-038) needs it, and TRADINGAPP_REQUIRE_QT_GRAPHS=1 below makes its
          # absence a hard failure rather than a release that silently ships without it.
          # qtquick3d + qtshadertools too: Qt6Graphs' OWN CMake package
          # (Qt6GraphsDependencies.cmake) target_deps lists Qt6Quick3D and
          # Qt6Quick3DRuntimeRender alongside Qt6Core/Gui/Quick — Qt Graphs is built
          # on Quick3D's renderer even though nothing here uses the Quick3D API
          # directly. Quick3DRuntimeRender in turn depends on Qt6ShaderTools. Missing
          # either makes find_package(Qt6 QUIET COMPONENTS Graphs) silently report
          # NOT FOUND (no console message, since it's QUIET) and the
          # TRADINGAPP_REQUIRE_QT_GRAPHS check then fails at configure time. Found
          # 2026-08-17: v1.1.0 and the first v1.1.1 attempt both failed here on EVERY
          # platform; it only ever "worked" on the maintainer's own dev machine
          # because Quick3D/ShaderTools happened to already be installed there from
          # an unrelated, later-removed 3D-graphs experiment. Verified by a
          # from-scratch aqt install: qtcharts+qtgraphs+qtquick3d alone still failed
          # (missing qtshadertools); all four together built TradingCockpit clean.
          modules: qtcharts qtgraphs qtquick3d qtshadertools
          cache: true

      - name: Install build + AppImage dependencies
        run: |
          sudo apt-get update -qq
          # libfuse2: the AppImage runtime; libxcb-*: what the Qt xcb platform
          # plugin links against, so linuxdeploy can resolve and bundle it.
          sudo apt-get install -y -qq ninja-build libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0
          python3 -m pip install --upgrade cmake

      - name: Package
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          TRADINGAPP_REQUIRE_QT_GRAPHS: '1'
        run: ./tools/package_appimage.sh

      # Proves the artifact actually starts on a machine with no Qt installed:
      # the AppImage bundles the offscreen platform plugin for exactly this.
      - name: Smoke test (headless start)
        run: |
          set -euo pipefail
          app="$(ls downloads/TradingApp-*-x86_64.AppImage)"
          QT_QPA_PLATFORM=offscreen ETORO_MODE=demo timeout 25 "$app" && rc=$? || rc=$?
          # 124 = still running when the timeout fired, which is the healthy
          # outcome for a GUI app; anything else means it exited on its own.
          if [ "$rc" -ne 124 ]; then
            echo "AppImage exited with $rc instead of running" >&2
            exit 1
          fi
          echo "AppImage started and stayed up"

      # A SEPARATE smoke test for the cockpit specifically: the AppImage above only
      # proves TradingApp (Qt Widgets + Charts) starts, and a missing/broken Qt Graphs
      # QML plugin would NOT show up there at all — it fails inside TradingCockpit's
      # own Qt Quick engine (silently, per the CMakeLists comment on this exact class
      # of bug: "ValueAxis is not a type", a blank window, no other symptom). AUT_DIR
      # is where linuxdeploy places both executables side by side inside the AppImage's
      # own extracted tree.
      - name: Smoke test the cockpit (Qt Graphs QML actually resolves)
        run: |
          set -euo pipefail
          app="$(ls downloads/TradingApp-*-x86_64.AppImage)"
          extract_dir="$(mktemp -d)"
          (cd "$extract_dir" && APPIMAGE_EXTRACT_AND_RUN=1 "$OLDPWD/$app" --appimage-extract >/dev/null)
          cockpit="$extract_dir/squashfs-root/usr/bin/TradingCockpit"
          if [ ! -x "$cockpit" ]; then
            echo "no TradingCockpit binary inside the AppImage — Qt Graphs did not ship" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen QML_XHR_ALLOW_FILE_READ=1 timeout 25 "$cockpit" \
            2> >(tee /tmp/cockpit-stderr.log >&2) && rc=$? || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "TradingCockpit exited with $rc instead of running" >&2
            exit 1
          fi
          # The exact symptom this class of bug produces, per CMakeLists.txt's own
          # comment: no crash, no non-zero exit — just this line on stderr.
          if grep -qi "is not a type\|Multiple C++ types called" /tmp/cockpit-stderr.log; then
            echo "TradingCockpit started but its QML failed to resolve a Qt Graphs type:" >&2
            cat /tmp/cockpit-stderr.log >&2
            exit 1
          fi
          echo "TradingCockpit started and its QML loaded cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            downloads/*.AppImage
            downloads/*.AppImage.sha256

  appimage-arm64:
    name: Linux AppImage (ARM64 / Raspberry Pi)
    # NOT ubuntu-22.04-arm, even though the x86-64 job above uses 22.04 to reach
    # the oldest possible glibc. Qt's own ARM64 binaries set the floor here, and
    # they are stricter than the x86-64 ones: measured 2026-08-04 with objdump -T
    # on the aqt kits, libQt6Gui/libQt6Network for aarch64 reference GLIBC_2.38
    # (in 6.8.3, 6.9.3 AND 6.11.1 — there is no older, laxer ARM64 kit), while
    # the x86-64 build of the same version stops at GLIBC_2.34. A 22.04-arm
    # runner (glibc 2.35) therefore cannot even link this package.
    # Consequence for the download: it needs glibc >= 2.39, i.e. Raspberry Pi OS
    # TRIXIE (2.41) or Ubuntu 24.04 for Pi — Bookworm (2.36) is below Qt's own
    # floor and no build setting here can change that. See docs/platforms.md.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # aqt, not install-qt-action: the ARM64 desktop kit lives under its own aqt
      # host (linux_arm64) and belongs in the ~/Qt layout package_appimage.sh
      # resolves on its own — the same command ./setup.sh runs on a Pi.
      - name: Install Qt for Linux ARM64 (with Charts and Graphs)
        run: |
          set -euo pipefail
          # --break-system-packages: the 24.04 image's python3 is externally
          # managed (PEP 668), unlike the 22.04 one the x86-64 job runs on.
          python3 -m pip install --break-system-packages --upgrade aqtinstall
          # qtgraphs alongside qtcharts: see the x86-64 job's comment — same reason,
          # same TRADINGAPP_REQUIRE_QT_GRAPHS=1 below. qtquick3d too: Qt Graphs'
          # own CMake package depends on it (same comment, same root cause).
          python3 -m aqt install-qt linux_arm64 desktop "$QT_VERSION" linux_gcc_arm64 \
            -m qtcharts qtgraphs qtquick3d qtshadertools -O "$HOME/Qt"

      - name: Install build + AppImage dependencies
        run: |
          sudo apt-get update -qq
          # libgl1-mesa-dev and friends are NOT optional here: Qt6Gui's own CMake
          # config sets Qt6Gui_FOUND=FALSE when OpenGL's headers are missing, and the
          # configure step then fails with the misleading "Failed to find required Qt
          # component Gui" — the ubuntu-24.04-arm image does not ship them, while the
          # 22.04 x86-64 image the sibling job runs on happens to.
          sudo apt-get install -y -qq ninja-build libfuse2 \
            libgl1-mesa-dev libglx-dev libegl1-mesa-dev libglu1-mesa-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon-dev
          python3 -m pip install --break-system-packages --upgrade cmake

      # No QT_PREFIX on purpose: the script has to find ~/Qt/<ver>/gcc_arm64 by
      # itself, exactly as it must on a Raspberry Pi.
      - name: Package
        env:
          TRADINGAPP_REQUIRE_QT_GRAPHS: '1'
        run: ./tools/package_appimage.sh

      - name: Smoke test (headless start)
        run: |
          set -euo pipefail
          app="$(ls downloads/TradingApp-*-aarch64.AppImage)"
          QT_QPA_PLATFORM=offscreen ETORO_MODE=demo timeout 25 "$app" && rc=$? || rc=$?
          # 124 = still running when the timeout fired: the healthy outcome for a
          # GUI app. Anything else means it exited on its own.
          if [ "$rc" -ne 124 ]; then
            echo "AppImage exited with $rc instead of running" >&2
            exit 1
          fi
          echo "aarch64 AppImage started and stayed up"

      # Same cockpit-specific check as the x86-64 job, and for the same reason: the
      # AppImage smoke test above only proves TradingApp (Widgets + Charts) starts.
      - name: Smoke test the cockpit (Qt Graphs QML actually resolves)
        run: |
          set -euo pipefail
          app="$(ls downloads/TradingApp-*-aarch64.AppImage)"
          extract_dir="$(mktemp -d)"
          (cd "$extract_dir" && APPIMAGE_EXTRACT_AND_RUN=1 "$OLDPWD/$app" --appimage-extract >/dev/null)
          cockpit="$extract_dir/squashfs-root/usr/bin/TradingCockpit"
          if [ ! -x "$cockpit" ]; then
            echo "no TradingCockpit binary inside the AppImage — Qt Graphs did not ship" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen timeout 25 "$cockpit" \
            2> >(tee /tmp/cockpit-stderr.log >&2) && rc=$? || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "TradingCockpit exited with $rc instead of running" >&2
            exit 1
          fi
          if grep -qi "is not a type\|Multiple C++ types called" /tmp/cockpit-stderr.log; then
            echo "TradingCockpit started but its QML failed to resolve a Qt Graphs type:" >&2
            cat /tmp/cockpit-stderr.log >&2
            exit 1
          fi
          echo "TradingCockpit started and its QML loaded cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-arm64
          path: |
            downloads/*.AppImage
            downloads/*.AppImage.sha256

  windows-zip:
    name: Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt (with Charts and Graphs)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          arch: win64_msvc2022_64
          modules: qtcharts qtgraphs qtquick3d qtshadertools
          cache: true

      - name: Install CMake + Ninja
        run: python -m pip install --upgrade cmake ninja

      # tools\common.ps1 imports the Visual Studio developer environment itself
      # (vswhere + vcvars64) — the same reason ci.yml needs no msvc-dev-cmd.
      - name: Package
        shell: powershell
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          TRADINGAPP_REQUIRE_QT_GRAPHS: '1'
        run: |
          .\tools\package_portable.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: |
            downloads/*.zip
            downloads/*.zip.sha256

  android-apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      # build_android.sh expects the developer layout: ~/Qt/<ver>/<abi> plus the
      # matching DESKTOP kit as androiddeployqt's host — install-qt-action puts
      # kits elsewhere, so use aqt directly. Android kits come from the `all_os`
      # host for Qt >= 6.8 (the same command the script's skip message prints).
      - name: Install Qt kits (host + Android, with Charts)
        run: |
          python3 -m pip install aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m qtcharts -O "$HOME/Qt"
          python3 -m aqt install-qt all_os android "$QT_VERSION" android_arm64_v8a -m qtcharts -O "$HOME/Qt"

      # The runner ships an Android SDK; add the exact NDK the Qt kit was built
      # against (build_android.sh reads the version the same way and would warn
      # on a mismatch — better to install the right one than to warn).
      - name: Install the NDK the Qt kit expects
        run: |
          set -euo pipefail
          ndk="$(grep -rhoE '"ndk_version"[^"]*"[0-9.]+"' "$HOME/Qt/$QT_VERSION/android_arm64_v8a/modules" |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')"
          echo "Qt $QT_VERSION expects NDK $ndk"
          # No `yes |` here: under pipefail, `yes` dies of SIGPIPE the moment
          # sdkmanager closes stdin and the pipeline "fails" after a successful
          # install (observed on the first run). The runner image has the SDK
          # licenses pre-accepted, so no prompt needs answering.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null < /dev/null

      # The runner's cmake (3.31) predates the 4.x this project requires; pip
      # serves current cmake + ninja, same as the other two jobs.
      - name: Install CMake + Ninja
        run: python3 -m pip install --upgrade cmake ninja

      - name: Build + sign the APK
        run: ./tools/build_android.sh --abi android_arm64_v8a --release

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            downloads/*.apk
            downloads/*.apk.sha256

  # The ACTUAL gate: build_all's core stages, hard-failing. Nothing here is `|| true` —
  # a red test suite, a hard traceability gap or a non-zero analyzer finding fails
  # THIS job, and `publish` below needs it, so a failure here blocks the release
  # outright. This is deliberately separate from `quality-report`: that job's PDF is
  # evidence to attach, produced even from a failed run (`|| true` there is correct
  # for THAT job's own purpose, spelled out in its own comment) — but it must never
  # be the thing standing between a broken build and a published release, which it
  # was, since `publish` depended on it and not on anything that actually checks.
  # Money-moving relevance: this app can place real orders, so "the tag that got
  # released never actually passed its own test suite" is not a theoretical risk.
  release-gate:
    name: Release gate (tests + traceability + analysis must pass)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt (with Charts and Graphs)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          arch: linux_gcc_64
          modules: qtcharts qtgraphs qtquick3d qtshadertools
          cache: true

      - name: Install analyzers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cppcheck clang-tidy clang-tools clazy \
            libgl1-mesa-dev libglx-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          python3 -m pip install --upgrade cmake ninja lizard strictdoc codespell
          ./tools/fetch_pmd.sh

      # No `|| true`: this is the whole point of this job. build_all.sh already
      # exits non-zero the moment any of these stages is red (analysis includes the
      # eight-analyzer + code-metrics-ratchet + PMD-clone gates; trace is the
      # requirements-traceability hard-gap check).
      - name: Build, test, trace, analyse
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build_all.sh build test trace analysis

  quality-report:
    name: Quality report (PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt (with Charts and Graphs)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          arch: linux_gcc_64
          modules: qtcharts qtgraphs qtquick3d qtshadertools
          cache: true

      - name: Install the tools the report summarises
        run: |
          set -euo pipefail
          sudo apt-get update
          # clazy, lcov and the GL headers were missing on the first run, so the
          # analysis and coverage stages had nothing to measure with and the PDF would
          # have reported half its sections as "not run".
          sudo apt-get install -y --no-install-recommends \
            ninja-build cppcheck clang-tidy clang-tools clazy lcov \
            libgl1-mesa-dev libglx-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          python3 -m pip install --upgrade cmake ninja lizard reportlab strictdoc \
            gcovr codespell
          # PMD (the clone gate) is a download, not a package.
          ./tools/fetch_pmd.sh || echo "PMD unavailable — clone detection will report skipped"

      # Everything the report has evidence for, in the order it reads it: the build,
      # the suite, the traceability matrix, then the analyzers. `--skip axivion`
      # because Axivion Suite is licensed and x86-64-host-only — the report marks
      # that section as "not run here" rather than inventing it (see below).
      # The GATES for this commit are the CI workflow, which runs the same stages and
      # must be green before a tag is pushed. Here the stages run to PRODUCE evidence
      # for the PDF, so a non-zero stage must not abort the job before the report is
      # rendered — make_report.py reads whatever was measured and cannot flatter it:
      # a finding shows up in the PDF as a finding.
      - name: Build, test, trace, analyse
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build_all.sh build test trace analysis coverage || true

      - name: Render the PDF
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python3 tools/make_report.py
          ls -l downloads/*.pdf

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-report
          path: |
            downloads/*.pdf
            docs/traceability.html
            analysis-results/
            test-results/

  publish:
    name: Attach to the release
    # Tag pushes only: a manual run stops after the build jobs, so the
    # packaging can be tested without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, appimage-arm64, windows-zip, android-apk, quality-report, release-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true

      - name: Create or update the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The CORRESPONDING SOURCE, produced here rather than only by
          # tools/publish_release.sh: this job is what creates the release and attaches
          # the binaries, so the GPL-3.0-or-later obligation to offer the source must be
          # met on THIS path too — a release published by CI alone still ships binaries.
          # HEAD, not "$tag": actions/checkout is a shallow clone already positioned ON
          # the tag, so HEAD is that commit while refs/tags/<tag> is not guaranteed to
          # exist locally — naming the tag would fail on a fetch-depth-1 checkout.
          version="${tag#v}"
          git archive --format=tar.gz --prefix="TradingApp-$version/" \
            -o "downloads/TradingApp-$version-source.tar.gz" HEAD
          (cd downloads && sha256sum "TradingApp-$version-source.tar.gz" \
            > "TradingApp-$version-source.tar.gz.sha256")
          # The licence texts as their own small asset, so a recipient does not have to
          # unpack the source archive to read the terms.
          cp LICENSE "downloads/LICENSE.txt"
          cp THIRD_PARTY_LICENSES.md "downloads/THIRD_PARTY_LICENSES.md"
          ls -l downloads
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "eToro Trader $tag" \
              --generate-notes \
              --latest
          fi
          # A finished release, explicitly: a pre-release shows as an orange badge and
          # is not what "latest release" should point at.
          gh release edit "$tag" --prerelease=false --draft=false --latest
          # FILES only, and only at the top level: the quality-report artifact also
          # carries analysis-results/, test-results/ and docs/ as directories (evidence
          # for the PDF), and `gh release upload` fails the whole step on the first
          # directory it is handed ("read downloads/analysis-results: is a directory").
          # Top-level files, PLUS the quality PDF wherever it landed: the report job's
          # artifact keeps its own internal paths, so the PDF arrives at
          # downloads/downloads/*.pdf and a plain -maxdepth 1 walks straight past it
          # (v1.0.2 published without it for exactly that reason). Directories are
          # still excluded — `gh release upload` fails the whole step on the first one.
          mapfile -t assets < <({ find downloads -maxdepth 1 -type f
                                  find downloads -mindepth 2 -type f -name '*.pdf'; } | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no assets were produced — refusing to publish an empty release" >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          echo "### Assets attached to $tag" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${assets[@]}" | xargs -n1 basename | sed 's/^/- /' \
            >> "$GITHUB_STEP_SUMMARY"
