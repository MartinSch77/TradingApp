# Configuration for SonarCloud's AUTOMATIC ANALYSIS — the server-side scan of
# this repository (no CI involved). Automatic analysis reads ONLY this file;
# sonar-project.properties serves the scanner-based runs instead (the local
# tools/sonar_scan.sh and .github/workflows/sonarcloud.yml when SONAR_TOKEN is
# set). Keep the two aligned when the analysis scope changes.
#
# Both entries answer a standing "Warnings in last analysis" on sonarcloud.io:
#
# The Python in this repo (tools/, axivion/) targets naked Debian/Ubuntu
# systems: Debian 11..13 and Ubuntu 22.04/24.04, i.e. CPython 3.9 through 3.13.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13

# Binaries must not be read as text: the app icon was scanned as UTF-8 source,
# which produced the "problems with file encoding" warning on every analysis.
sonar.exclusions=**/*.png
