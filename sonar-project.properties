# SonarQube / SonarCloud project configuration.
#
# Local server: tools/sonar_scan.sh runs the scan ONLY when a SonarQube server
# is actually reachable (SONAR_HOST_URL, default http://localhost:9000) and
# sonar-scanner is installed; afterwards it exports the open issues so they
# appear on the Axivion dashboard (provider "sonarqube").
# SonarCloud (free for public GitHub repositories): set the SONAR_TOKEN
# repository secret — .github/workflows/sonarcloud.yml then activates itself.
sonar.projectKey=TradingApp
sonar.projectName=TradingApp
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.cfamily.compile-commands=build/compile_commands.json
# Generated / third-party trees:
sonar.exclusions=build*/**,docs/html/**,docs/strictdoc/**,docs/sphinx-html/**,coverage/**,tools/third-party/**
